<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Mayte Cacharrón — Psicóloga sanitaria · Logopeda</title>
  <desc>Logotipo horizontal con monograma MC, arco dorado y detalle botánico.</desc>

  <!-- Paleta -->
  <defs>
    <style>
      .forest { fill: #23443A; }
      .gold { fill: #C6A66B; stroke: #C6A66B; }
      .sage { fill: #8FA99B; }
      .body { fill: #23443A; font-family: Arial, Helvetica, sans-serif; }
      .display { fill: #23443A; font-family: Georgia, "Times New Roman", serif; }
    </style>
  </defs>

  <!-- Símbolo -->
  <g transform="translate(24 25)">
    <!-- Arco dorado -->
    <path d="M26 122C26 61.2 75.2 12 136 12C164.2 12 190.3 22.6 210.1 40.4"
          stroke="#C6A66B" stroke-width="3" stroke-linecap="round"/>

    <!-- Monograma -->
    <text x="56" y="155" font-family="Georgia, 'Times New Roman', serif"
          font-size="112" letter-spacing="-12" fill="#23443A">M</text>
    <text x="113" y="171" font-family="Georgia, 'Times New Roman', serif"
          font-size="92" letter-spacing="-10" fill="#C6A66B">C</text>

    <!-- Detalle botánico -->
    <path d="M176 173C193 146 207 120 213 92"
          stroke="#8FA99B" stroke-width="3" stroke-linecap="round"/>

    <path d="M188 151C181 138 180 123 186 111C196 118 200 131 188 151Z"
          fill="#8FA99B"/>
    <path d="M199 132C196 116 201 102 213 94C218 109 213 122 199 132Z"
          fill="#8FA99B"/>
    <path d="M207 113C208 98 217 86 230 82C230 97 222 107 207 113Z"
          fill="#8FA99B"/>

    <!-- Puntos -->
    <circle cx="214" cy="52" r="5" fill="#C6A66B"/>
    <circle cx="232" cy="67" r="4" fill="#C6A66B"/>
  </g>

  <!-- Separador -->
  <line x1="255" y1="57" x2="255" y2="203" stroke="#C6A66B" stroke-width="2"/>

  <!-- Nombre -->
  <text x="300" y="111"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="78"
        fill="#23443A">Mayte</text>

  <text x="303" y="158"
        font-family="Arial, Helvetica, sans-serif"
        font-size="33"
        font-weight="500"
        letter-spacing="11"
        fill="#23443A">CACHARRÓN</text>

  <!-- Línea dorada -->
  <line x1="303" y1="178" x2="455" y2="178" stroke="#C6A66B" stroke-width="2"/>

  <!-- Descriptor -->
  <text x="303" y="214"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16"
        font-weight="600"
        letter-spacing="3.5"
        fill="#23443A">PSICÓLOGA SANITARIA · LOGOPEDA</text>
</svg>
